<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Arquivos no Servidor</title>
</head>
<body>
    <h2>Arquivos salvos no servidor</h2>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th>Arquivo</th>
                <th>Tamanho</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabela-arquivos">
            <tr><td colspan="3">Carregando...</td></tr>
        </tbody>
    </table>

    <script>
        async function carregarArquivos() {
            const resposta = await fetch('/listar_arquivos');
            const dados = await resposta.json();
            const corpo = document.getElementById('tabela-arquivos');
            corpo.innerHTML = '';

            if (dados.length === 0) {
                corpo.innerHTML = '<tr><td colspan="3">Nenhum arquivo encontrado.</td></tr>';
                return;
            }

            dados.forEach(arquivo => {
                const linha = document.createElement('tr');

                const tdCaminho = document.createElement('td');
                tdCaminho.textContent = arquivo.caminho;
                linha.appendChild(tdCaminho);

                const tdTamanho = document.createElement('td');
                tdTamanho.textContent = arquivo.tamanho;
                linha.appendChild(tdTamanho);

                const tdAcao = document.createElement('td');
                const botao = document.createElement('button');
                botao.textContent = 'Excluir';
                botao.onclick = () => {
                    if (confirm(`Deseja excluir o arquivo:\n${arquivo.caminho}?`)) {
                        fetch('/excluir_arquivo', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({caminho: arquivo.caminho})
                        }).then(() => carregarArquivos());
                    }
                };
                tdAcao.appendChild(botao);
                linha.appendChild(tdAcao);

                corpo.appendChild(linha);
            });
        }

        carregarArquivos();
    </script>
</body>
</html>
