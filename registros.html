<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Registros de QR Codes</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    .top-bar {
      margin-bottom: 20px;
    }

    select {
      padding: 8px;
      margin: 0 10px;
      font-size: 14px;
      width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      background-color: white;
    }

    th {
      background-color: #e0e0e0;
    }

    button {
      padding: 6px 12px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .mensagem {
      margin-top: 15px;
      font-weight: bold;
    }

    .mensagem.sucesso {
      color: green;
    }

    .mensagem.erro {
      color: red;
    }

    #voltar {
      margin-bottom: 20px;
      background-color: #0275d8;
    }
  </style>
</head>
<body>
  <h1>Registros de QR Codes</h1>
  <button id="voltar" onclick="window.location.href='/'">Voltar</button>

  <div class="top-bar">
<input type="text" id="filtroQR" placeholder="Digite o Código QR" />

    <select id="filtroUsuario">
      <option value="">Filtrar por Usuário</option>
    </select>
  </div>

  <div id="mensagem" class="mensagem"></div>

  <table id="tabelaQR">
    <thead>
      <tr>
        <th>ID</th>
        <th>Código QR</th>
        <th>Usuário</th>
        <th>Data e Hora</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function mostrarMensagem(msg, sucesso) {
      const el = document.getElementById("mensagem");
      el.textContent = msg;
      el.className = "mensagem " + (sucesso ? "sucesso" : "erro");
    }

    function excluirRegistro(id) {
      const senha = prompt("Digite a senha para excluir o registro:");
      if (senha !== "@pcp1234") {
        mostrarMensagem("Senha incorreta. Ação não autorizada.", false);
        return;
      }

      fetch(`/excluir_qr/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(res => {
          if (res.sucesso) {
            mostrarMensagem("Registro excluído com sucesso!", true);
            $('#tabelaQR').DataTable().ajax.reload();
            new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg').play();
          } else {
            mostrarMensagem("Erro ao excluir o registro.", false);
          }
        })
        .catch(() => {
          mostrarMensagem("Erro ao comunicar com o servidor.", false);
        });
    }

$(document).ready(function () {
  const tabela = $('#tabelaQR').DataTable({
    processing: true,
    serverSide: true,
    searching: false,

    ajax: {
      url: '/listar_qr',
      type: 'GET',
      data: function (d) {
        d.filtroQR = $('#filtroQR').val();
        d.filtroUsuario = $('#filtroUsuario').val();
      }
    },
    columns: [
      { data: 'id' },
      { data: 'codigo_qr' },
      { data: 'usuario' },
      { data: 'data_hora' },
      {
        data: 'id',
        render: function (data) {
          return `<button onclick="excluirRegistro(${data})">Excluir</button>`;
        }
      }
    ],
    language: {
      url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
    },
    pageLength: 10,
    lengthMenu: [10, 25, 50, 100]
  });

  // Recarrega ao trocar os filtros
$('#filtroUsuario').on('change', function () {
  tabela.ajax.reload();
});

$('#filtroQR').on('input', function () {
  tabela.ajax.reload();
});


  // Carregar opções de filtro de usuário
fetch('/listar_qr_filtros')
  .then(res => res.json())
  .then(data => {
    const usuarioSelect = $('#filtroUsuario');
    const usuariosUnicos = [...new Set(data.map(r => r.usuario))].sort();

    usuariosUnicos.forEach(u => {
      usuarioSelect.append(`<option value="${u}">${u}</option>`);
    });
  });

});
  </script>
</body>
</html>
